<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title> Admin — Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#EEF2DC;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:20px;padding:40px 32px;width:100%;max-width:380px;box-shadow:0 8px 32px rgba(135,206,235,0.2)}
.logo{text-align:center;font-size:28px;font-weight:800;color:#87CEEB;letter-spacing:4px;margin-bottom:6px}
.subtitle{text-align:center;color:#888;font-size:14px;margin-bottom:32px}
label{display:block;font-size:13px;font-weight:600;color:#444;margin-bottom:6px}
input{width:100%;border:1.5px solid #e0e0e0;border-radius:10px;padding:11px 14px;font-size:14px;outline:none;transition:border 0.2s;margin-bottom:16px}
input:focus{border-color:#87CEEB}
.login-btn{width:100%;background:#87CEEB;color:#fff;border:none;padding:13px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;transition:background 0.2s}
.login-btn:hover{background:#5BB8D4}
.error{color:#ef4444;font-size:13px;text-align:center;margin-bottom:12px;display:none}
.back{text-align:center;margin-top:16px;font-size:13px;color:#888}
.back a{color:#87CEEB;text-decoration:none;font-weight:600}
</style>
</head>
<body>

<div class="card">
  <div class="logo">ONE4</div>
  <div class="subtitle">Admin Panel Login</div>
  <div class="error" id="error">Invalid email or password</div>
  <label>Email</label>
  <input type="email" id="email" placeholder="admin@email.com"/>
  <label>Password</label>
  <input type="password" id="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()"/>
  <button class="login-btn" onclick="login()" id="loginBtn">Login →</button>
  <div class="back"><a href="index.html">← Back to Shop</a></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
// Check already logged in
auth.onAuthStateChanged(user => {
  if (user) window.location.href = 'admin.html'
})

async function login() {
  const email = document.getElementById('email').value
  const password = document.getElementById('password').value
  const btn = document.getElementById('loginBtn')
  const err = document.getElementById('error')
  
  if (!email || !password) { err.style.display='block'; err.textContent='Please enter email and password'; return }
  
  btn.textContent = 'Logging in...'
  btn.disabled = true
  err.style.display = 'none'

  try {
    await auth.signInWithEmailAndPassword(email, password)
    window.location.href = 'admin.html'
  } catch(e) {
    err.style.display = 'block'
    err.textContent = 'Invalid email or password'
    btn.textContent = 'Login →'
    btn.disabled = false
  }
}
</script>
</body>
</html>
