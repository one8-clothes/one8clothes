<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Checkout — one8</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f7fa;color:#1a1a1a}
.nav{background:#87CEEB;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:20px;font-weight:800;color:#fff;letter-spacing:3px;text-decoration:none}
.back{color:#fff;font-size:14px;text-decoration:none;font-weight:600}

.container{max-width:900px;margin:0 auto;padding:24px 16px}
h1{font-size:24px;font-weight:800;margin-bottom:24px}

.grid{display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}

.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
.card-title{font-size:17px;font-weight:700;margin-bottom:18px}
.form-group{margin-bottom:14px}
label{display:block;font-size:13px;font-weight:600;color:#444;margin-bottom:5px}
input{width:100%;border:1.5px solid #e0e0e0;border-radius:10px;padding:10px 14px;font-size:14px;outline:none;transition:border 0.2s}
input:focus{border-color:#87CEEB}

.order-item{display:flex;justify-content:space-between;font-size:14px;padding:10px 0;border-bottom:1px solid #f0f0f0}
.order-item:last-of-type{border:none}
.total-row{display:flex;justify-content:space-between;font-size:14px;color:#555;margin-bottom:6px}
.total-final{display:flex;justify-content:space-between;font-size:18px;font-weight:800;margin:12px 0 20px;padding-top:12px;border-top:2px solid #f0f0f0}

.pay-btn{width:100%;background:#E8734A;color:#fff;border:none;padding:15px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}
.pay-btn:hover{background:#d45a2a}
.pay-btn:disabled{opacity:0.5;cursor:not-allowed}
.secure{text-align:center;font-size:12px;color:#aaa;margin-top:8px}

.empty{text-align:center;padding:60px;color:#aaa}
</style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="logo">one8</a>
  <a href="index.html" class="back">← Continue Shopping</a>
</nav>

<div class="container">
  <h1>Checkout</h1>
  <div id="emptyMsg" class="empty" style="display:none">
    <p style="font-size:40px">🛒</p>
    <p>Your cart is empty</p>
    <a href="index.html" style="color:#87CEEB;font-weight:600">Shop Now →</a>
  </div>
  <div class="grid" id="checkoutGrid">
    <!-- Delivery Form -->
    <div class="card">
      <div class="card-title">Delivery Details</div>
      <div class="form-group"><label>Full Name *</label><input type="text" id="custName" placeholder="Your full name"/></div>
      <div class="form-group"><label>Phone Number *</label><input type="tel" id="custPhone" placeholder="10 digit number"/></div>
      <div class="form-group"><label>Email</label><input type="email" id="custEmail" placeholder="your@email.com"/></div>
      <div class="form-group"><label>Full Address *</label><input type="text" id="custAddress" placeholder="House no, Street, Area"/></div>
      <div class="form-group"><label>City</label><input type="text" id="custCity" placeholder="City name"/></div>
      <div class="form-group"><label>Pincode *</label><input type="text" id="custPincode" placeholder="6 digit pincode"/></div>
    </div>

    <!-- Order Summary -->
    <div>
      <div class="card">
        <div class="card-title">Order Summary</div>
        <div id="orderItems"></div>
        <div class="total-row"><span>Subtotal</span><span id="subtotal">₹0</span></div>
        <div class="total-row"><span>Delivery</span><span id="delivery">₹49</span></div>
        <div class="total-final"><span>Total</span><span id="total">₹0</span></div>
        <button class="pay-btn" id="payBtn" onclick="placeOrder()">Pay Now →</button>
        <div class="secure">🔒 Secured Payment via Razorpay</div>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
const cart = JSON.parse(localStorage.getItem('one8_cart') || '[]')

if (cart.length === 0) {
  document.getElementById('checkoutGrid').style.display = 'none'
  document.getElementById('emptyMsg').style.display = 'block'
} else {
  const subtotalAmt = cart.reduce((a,b)=>a+b.price*b.qty,0)
  const deliveryAmt = subtotalAmt >= 499 ? 0 : 49
  const totalAmt = subtotalAmt + deliveryAmt

  document.getElementById('orderItems').innerHTML = cart.map(item=>`
    <div class="order-item">
      <span>${item.name} (${item.size}) × ${item.qty}</span>
      <span>₹${item.price*item.qty}</span>
    </div>
  `).join('')

  document.getElementById('subtotal').textContent = '₹'+subtotalAmt
  document.getElementById('delivery').textContent = deliveryAmt===0?'FREE':'₹'+deliveryAmt
  document.getElementById('total').textContent = '₹'+totalAmt
}

async function placeOrder() {
  const name = document.getElementById('custName').value.trim()
  const phone = document.getElementById('custPhone').value.trim()
  const address = document.getElementById('custAddress').value.trim()
  const pincode = document.getElementById('custPincode').value.trim()

  if (!name || !phone || !address || !pincode) {
    alert('Please fill all required fields (Name, Phone, Address, Pincode)')
    return
  }

  const subtotalAmt = cart.reduce((a,b)=>a+b.price*b.qty,0)
  const deliveryAmt = subtotalAmt >= 499 ? 0 : 49
  const totalAmt = subtotalAmt + deliveryAmt

  // Load Razorpay
  const script = document.createElement('script')
  script.src = 'https://checkout.razorpay.com/v1/checkout.js'
  document.body.appendChild(script)

  script.onload = () => {
    const options = {
      key: 'rzp_test_Tj54JcCAt08qsq', // your test key
      amount: totalAmt * 100,
      currency: 'INR',
      name: 'one8 Clothing',
      description: cart.length + ' item(s)',
      handler: async function(response) {
        // Save order to Firebase
        const orderRef = await db.collection('orders').add({
          customerName: name,
          customerPhone: phone,
          customerEmail: document.getElementById('custEmail').value,
          address: address,
          city: document.getElementById('custCity').value,
          pincode: pincode,
          items: cart,
          total: totalAmt,
          paymentId: response.razorpay_payment_id,
          status: 'paid',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        })
        localStorage.removeItem('one8_cart')
        localStorage.setItem('elen_last_order', orderRef.id)
window.location.href = 'success.html'
      },
      prefill: { name, contact: phone, email: document.getElementById('custEmail').value },
      theme: { color: '#87CEEB' }
    }
    new Razorpay(options).open()
  }
}
</script>
</body>
</html>
