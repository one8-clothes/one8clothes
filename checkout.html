<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Checkout — ONE4</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#1a1a1a}
.nav{background:#fff;border-bottom:1px solid #e8e8e8;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:64px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.logo{font-size:24px;font-weight:900;color:#6B8E23;letter-spacing:2px;text-decoration:none}
.logo span{color:#f97316}
.back{color:#6B8E23;font-size:14px;text-decoration:none;font-weight:600}
.container{max-width:900px;margin:0 auto;padding:24px 16px}
h1{font-size:24px;font-weight:800;margin-bottom:24px}
.grid{display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
.card-title{font-size:17px;font-weight:700;margin-bottom:18px;color:#1a1a1a}
.form-group{margin-bottom:14px}
label{display:block;font-size:13px;font-weight:600;color:#444;margin-bottom:5px}
input{width:100%;border:2px solid #e0e0e0;border-radius:10px;padding:10px 14px;font-size:14px;outline:none;transition:border 0.2s}
input:focus{border-color:#6B8E23}
.pay-methods{display:flex;gap:10px;margin-bottom:20px}
.pay-option{flex:1;border:2px solid #e0e0e0;border-radius:12px;padding:12px;text-align:center;cursor:pointer;background:#fff;transition:all 0.2s}
.pay-option.selected{border-color:#6B8E23;background:#f0f7e8}
.pay-option-icon{font-size:24px;margin-bottom:4px}
.pay-option-name{font-size:13px;font-weight:700;color:#555}
.pay-option.selected .pay-option-name{color:#6B8E23}
.pay-option-sub{font-size:11px;color:#94a3b8;margin-top:2px}
.order-item{display:flex;justify-content:space-between;font-size:14px;padding:10px 0;border-bottom:1px solid #f0f0f0}
.order-item:last-of-type{border:none}
.total-row{display:flex;justify-content:space-between;font-size:14px;color:#555;margin-bottom:6px}
.total-final{display:flex;justify-content:space-between;font-size:18px;font-weight:800;margin:12px 0 20px;padding-top:12px;border-top:2px solid #f0f0f0}
.pay-btn{width:100%;background:#E8734A;color:#fff;border:none;padding:15px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;transition:all 0.2s}
.pay-btn:hover{transform:translateY(-1px)}
.pay-btn:disabled{opacity:0.5;cursor:not-allowed}
.pay-btn.cod{background:#6B8E23}
.secure{text-align:center;font-size:12px;color:#aaa;margin-top:8px}
.empty{text-align:center;padding:60px;color:#aaa}
</style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="logo">ONE<span>8</span></a>
  <a href="index.html" class="back">Continue Shopping</a>
</nav>

<div class="container">
  <h1>Checkout</h1>

  <div id="emptyMsg" class="empty" style="display:none">
    <p style="font-size:40px">Shopping cart is empty</p>
    <a href="index.html" style="color:#6B8E23;font-weight:600">Shop Now</a>
  </div>

  <div class="grid" id="checkoutGrid">
    <div class="card">
      <div class="card-title">Delivery Details</div>
      <div class="form-group"><label>Full Name *</label><input type="text" id="custName" placeholder="Your full name"/></div>
      <div class="form-group"><label>Phone Number *</label><input type="tel" id="custPhone" placeholder="10 digit number"/></div>
      <div class="form-group"><label>Email</label><input type="email" id="custEmail" placeholder="your@email.com"/></div>
      <div class="form-group"><label>Full Address *</label><input type="text" id="custAddress" placeholder="House no, Street, Area"/></div>
      <div class="form-group"><label>City</label><input type="text" id="custCity" placeholder="City name"/></div>
      <div class="form-group"><label>Pincode *</label><input type="text" id="custPincode" placeholder="6 digit pincode"/></div>
    </div>

    <div>
      <div class="card">
        <div class="card-title">Order Summary</div>
        <div id="orderItems"></div>
        <div class="total-row"><span>Subtotal</span><span id="subtotal">0</span></div>
        <div class="total-row"><span>Delivery</span><span id="delivery">49</span></div>
        <div class="total-final"><span>Total</span><span id="total">0</span></div>

        <div class="card-title" style="margin-bottom:12px">Payment Method</div>
        <div class="pay-methods">
          <div class="pay-option selected" id="onlineOption" onclick="selectPayment('online')">
            <div class="pay-option-icon">&#x1F4B3;</div>
            <div class="pay-option-name">Pay Online</div>
            <div class="pay-option-sub">UPI - Card - Net Banking</div>
          </div>
          <div class="pay-option" id="codOption" onclick="selectPayment('cod')">
            <div class="pay-option-icon">&#x1F4B5;</div>
            <div class="pay-option-name">Cash on Delivery</div>
            <div class="pay-option-sub">Pay when delivered</div>
          </div>
        </div>

        <button class="pay-btn" id="payBtn" onclick="placeOrder()">Pay Now</button>
        <div class="secure">Secured by Razorpay</div>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
var cart = JSON.parse(localStorage.getItem('one8_cart') || '[]')
var selectedPayment = 'online'

if(cart.length === 0){
  document.getElementById('checkoutGrid').style.display = 'none'
  document.getElementById('emptyMsg').style.display = 'block'
} else {
  var subtotalAmt = cart.reduce(function(a,b){ return a + b.price*b.qty }, 0)
  var deliveryAmt = subtotalAmt >= 499 ? 0 : 49
  var totalAmt = subtotalAmt + deliveryAmt
  document.getElementById('orderItems').innerHTML = cart.map(function(item){
    return '<div class="order-item"><span>' + item.name + ' (' + item.size + ') x ' + item.qty + '</span><span>Rs.' + (item.price*item.qty) + '</span></div>'
  }).join('')
  document.getElementById('subtotal').textContent = 'Rs.' + subtotalAmt
  document.getElementById('delivery').textContent = deliveryAmt === 0 ? 'FREE' : 'Rs.' + deliveryAmt
  document.getElementById('total').textContent = 'Rs.' + totalAmt
}

function selectPayment(type){
  selectedPayment = type
  var onlineEl = document.getElementById('onlineOption')
  var codEl = document.getElementById('codOption')
  var payBtn = document.getElementById('payBtn')
  if(type === 'online'){
    onlineEl.classList.add('selected')
    codEl.classList.remove('selected')
    payBtn.textContent = 'Pay Now'
    payBtn.className = 'pay-btn'
  } else {
    codEl.classList.add('selected')
    onlineEl.classList.remove('selected')
    payBtn.textContent = 'Place Order - Cash on Delivery'
    payBtn.className = 'pay-btn cod'
  }
}

async function placeOrder(){
  var name = document.getElementById('custName').value.trim()
  var phone = document.getElementById('custPhone').value.trim()
  var address = document.getElementById('custAddress').value.trim()
  var pincode = document.getElementById('custPincode').value.trim()

  if(!name || !phone || !address || !pincode){
    alert('Please fill all required fields - Name, Phone, Address, Pincode')
    return
  }

  var subtotalAmt = cart.reduce(function(a,b){ return a + b.price*b.qty }, 0)
  var deliveryAmt = subtotalAmt >= 499 ? 0 : 49
  var totalAmt = subtotalAmt + deliveryAmt
  var currentUser = auth.currentUser

  if(selectedPayment === 'cod'){
    var btn = document.getElementById('payBtn')
    btn.textContent = 'Placing Order...'
    btn.disabled = true
    try{
      var orderRef = await db.collection('orders').add({
        customerName: name,
        customerPhone: phone,
        customerEmail: document.getElementById('custEmail').value,
        address: address,
        city: document.getElementById('custCity').value,
        pincode: pincode,
        items: cart,
        total: totalAmt,
        paymentMethod: 'cod',
        paymentId: 'COD',
        status: 'placed',
        userId: currentUser ? currentUser.uid : 'guest',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      })
      localStorage.setItem('elen_last_order', orderRef.id)
      localStorage.removeItem('one8_cart')
      window.location.href = 'success.html'
    } catch(e){
      alert('Something went wrong. Please try again.')
      btn.textContent = 'Place Order - Cash on Delivery'
      btn.disabled = false
    }
    return
  }

  var script = document.createElement('script')
  script.src = 'https://checkout.razorpay.com/v1/checkout.js'
  document.body.appendChild(script)

  script.onload = function(){
    var options = {
      key: 'rzp_test_Tj54JcCAt08qsq',
      amount: totalAmt * 100,
      currency: 'INR',
      name: 'One8 Clothing',
      description: cart.length + ' items',
      handler: async function(response){
        var orderRef = await db.collection('orders').add({
          customerName: name,
          customerPhone: phone,
          customerEmail: document.getElementById('custEmail').value,
          address: address,
          city: document.getElementById('custCity').value,
          pincode: pincode,
          items: cart,
          total: totalAmt,
          paymentMethod: 'online',
          paymentId: response.razorpay_payment_id,
          status: 'placed',
          userId: currentUser ? currentUser.uid : 'guest',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        })
        localStorage.setItem('elen_last_order', orderRef.id)
        localStorage.removeItem('one8_cart')
        window.location.href = 'success.html'
      },
      prefill: { name: name, contact: phone, email: document.getElementById('custEmail').value },
      theme: { color: '#6B8E23' }
    }
    new Razorpay(options).open()
  }
}
</script>
</body>
</html>
