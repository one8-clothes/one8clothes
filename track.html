<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Track Order — ONE4</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;min-height:100vh}
.nav{background:#fff;border-bottom:1px solid #e8e8e8;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:64px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.logo{font-size:24px;font-weight:900;color:#6B8E23;letter-spacing:2px;text-decoration:none}
.logo span{color:#f97316}
.back{color:#6B8E23;font-size:14px;font-weight:600;text-decoration:none}

.container{max-width:500px;margin:40px auto;padding:0 16px}
.card{background:#fff;border-radius:20px;padding:32px;box-shadow:0 4px 16px rgba(0,0,0,0.08)}
.title{font-size:22px;font-weight:800;margin-bottom:6px;color:#1a1a1a}
.subtitle{font-size:14px;color:#94a3b8;margin-bottom:28px}

.search-box{display:flex;gap:10px;margin-bottom:28px}
.search-box input{flex:1;border:2px solid #e0e0e0;border-radius:12px;padding:12px 16px;font-size:14px;outline:none;transition:border 0.2s}
.search-box input:focus{border-color:#6B8E23}
.search-btn{background:#6B8E23;color:#fff;border:none;padding:12px 20px;border-radius:12px;font-weight:700;cursor:pointer;font-size:14px;white-space:nowrap}
.search-btn:hover{background:#556B2F}

.order-info{background:#f8fafc;border-radius:12px;padding:16px;margin-bottom:24px;border:1px solid #e8e8e8}
.order-info-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.order-info-row:last-child{margin-bottom:0}
.order-info-label{color:#94a3b8;font-weight:500}
.order-info-value{font-weight:700;color:#1a1a1a}

.track-title{font-size:16px;font-weight:700;margin-bottom:20px;color:#1a1a1a}
.track-step{display:flex;gap:14px;margin-bottom:8px;align-items:flex-start}
.track-left{display:flex;flex-direction:column;align-items:center}
.track-dot{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.track-dot.done{background:#dcfce7;border:2px solid #22c55e}
.track-dot.active{background:#fef9c3;border:2px solid #eab308;animation:pulse 1.5s infinite}
.track-dot.pending{background:#f0f0f0;border:2px solid #ddd}
.track-line{width:2px;height:28px;margin:4px 0}
.track-line.done{background:#22c55e}
.track-line.pending{background:#e0e0e0}
.track-info{padding-top:8px;flex:1}
.track-label{font-weight:700;font-size:14px}
.track-label.done{color:#16a34a}
.track-label.active{color:#ca8a04}
.track-label.pending{color:#aaa}
.track-desc{font-size:12px;color:#94a3b8;margin-top:2px}

.error-box{text-align:center;padding:32px;color:#94a3b8;display:none}
.error-box p:first-child{font-size:48px;margin-bottom:12px}
.error-box p:last-child{font-size:15px;font-weight:500}

.last-order-btn{width:100%;background:#f0f7e8;color:#6B8E23;border:2px solid #6B8E23;padding:12px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:16px}
.last-order-btn:hover{background:#6B8E23;color:#fff}

@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
</style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="logo">ONE<span>4</span></a>
  <a href="index.html" class="back">← Back to Shop</a>
</nav>

<div class="container">
  <div class="card">
    <div class="title">📦 Track Your Order</div>
    <div class="subtitle">Enter your order ID or track your last order</div>

    <!-- Last Order Button -->
    <button class="last-order-btn" onclick="trackLastOrder()">
      🕐 Track My Last Order
    </button>

    <!-- Manual Search -->
    <div class="search-box">
      <input type="text" id="orderInput" placeholder="Enter Order ID..."/>
      <button class="search-btn" onclick="searchOrder()">Track →</button>
    </div>

    <!-- Error -->
    <div class="error-box" id="errorBox">
      <p>🔍</p>
      <p>Order not found. Check your Order ID.</p>
    </div>

    <!-- Order Info -->
    <div id="orderInfo" style="display:none">
      <div class="order-info">
        <div class="order-info-row">
          <span class="order-info-label">Order ID</span>
          <span class="order-info-value" id="infoId"></span>
        </div>
        <div class="order-info-row">
          <span class="order-info-label">Customer</span>
          <span class="order-info-value" id="infoName"></span>
        </div>
        <div class="order-info-row">
          <span class="order-info-label">Amount</span>
          <span class="order-info-value" id="infoAmount"></span>
        </div>
        <div class="order-info-row">
          <span class="order-info-label">Date</span>
          <span class="order-info-value" id="infoDate"></span>
        </div>
      </div>

      <div class="track-title">Order Progress</div>
      <div id="trackingSteps"></div>
    </div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
const steps = [
  { key:'placed',    icon:'🛍️', label:'Order Placed',     desc:'We received your order successfully' },
  { key:'confirmed', icon:'✅', label:'Order Confirmed',   desc:'Your order has been confirmed' },
  { key:'shipped',   icon:'🚚', label:'Shipped',           desc:'Your order is on the way' },
  { key:'delivery',  icon:'📦', label:'Out for Delivery',  desc:'Your order is almost there!' },
  { key:'delivered', icon:'🎉', label:'Delivered',         desc:'Your order has been delivered!' },
]

const order = ['placed','confirmed','shipped','delivery','delivered']

function trackLastOrder(){
  const lastId = localStorage.getItem('elen_last_order')
  if(!lastId){
    alert('No recent order found. Please enter your Order ID.')
    return
  }
  document.getElementById('orderInput').value = lastId
  searchOrder()
}

async function searchOrder(){
  const id = document.getElementById('orderInput').value.trim()
  if(!id){ alert('Please enter Order ID'); return }

  document.getElementById('errorBox').style.display = 'none'
  document.getElementById('orderInfo').style.display = 'none'

  try{
    const doc = await db.collection('orders').doc(id).get()
    if(!doc.exists){
      document.getElementById('errorBox').style.display = 'block'
      return
    }
    const data = doc.data()
    const status = data.status || 'placed'
    const date = data.createdAt?.toDate().toLocaleDateString('en-IN') || 'N/A'

    document.getElementById('infoId').textContent = '#' + id.slice(0,8).toUpperCase()
    document.getElementById('infoName').textContent = data.customerName || 'N/A'
    document.getElementById('infoAmount').textContent = '₹' + data.total
    document.getElementById('infoDate').textContent = date
    document.getElementById('orderInfo').style.display = 'block'

    renderTracking(status)
  } catch(e){
    document.getElementById('errorBox').style.display = 'block'
  }
}

function renderTracking(currentStatus){
  const currentIndex = order.indexOf(currentStatus)
  document.getElementById('trackingSteps').innerHTML = steps.map((step, i) => {
    const state = i < currentIndex ? 'done' : i === currentIndex ? 'active' : 'pending'
    const line = i < steps.length - 1
      ? `<div class="track-line ${i < currentIndex ? 'done':'pending'}"></div>`
      : ''
    return `
      <div class="track-step">
        <div class="track-left">
          <div class="track-dot ${state}">
            ${state === 'done' ? '✓' : step.icon}
          </div>
          ${line}
        </div>
        <div class="track-info">
          <div class="track-label ${state}">${step.label}</div>
          <div class="track-desc">${state === 'pending' ? 'Pending...' : step.desc}</div>
        </div>
      </div>
    `
  }).join('')
}

// Auto load if order ID in URL
const urlParams = new URLSearchParams(window.location.search)
const urlOrderId = urlParams.get('id')
if(urlOrderId){
  document.getElementById('orderInput').value = urlOrderId
  searchOrder()
}
</script>
</body>
</html>
